services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense_app
      POSTGRES_PASSWORD: expense_local_dev
      POSTGRES_DB: expense_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_app -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
